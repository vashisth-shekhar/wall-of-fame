<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall of Fame</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="hr-mode-badge" id="hrModeBadge">HR Mode</div>
    <div class="lock-status-badge" id="lockStatusBadge"></div>
    <button class="hr-panel-btn" id="hrPanelBtn" onclick="openHrPanel()">Manage Wall</button>

    <div class="container">
        <div class="locked-banner" id="lockedBanner">
            This Wall of Fame is currently published. Edit mode is disabled.
        </div>
        <div class="header">
            <h1>WALL of FAME</h1>
            <div class="trophy-icon" onclick="handleTrophyClick()" title="">
                <svg viewBox="0 0 24 24">
                    <path d="M12,15.39L8.24,17.66L9.23,13.38L5.91,10.5L10.29,10.13L12,6.09L13.71,10.13L18.09,10.5L14.77,13.38L15.76,17.66M22,9.24L14.81,8.63L12,2L9.19,8.63L2,9.24L7.45,13.97L5.82,21L12,17.27L18.18,21L16.54,13.97L22,9.24Z"/>
                </svg>
            </div>
        </div>
        <div class="awards-grid" id="awardsGrid"></div>
    </div>

    <div class="modal hr-panel-modal" id="hrPanelModal">
        <div class="modal-content">
            <div class="panel-header-row">
                <div class="modal-header no-margin-bottom">Manage Wall of Fame</div>
                <span class="panel-count-badge" id="slotCountBadge">0 slots</span>
            </div>
            <div class="bulk-add-row">
                <select id="bulkCount">
                    <option value="1">+1 slot</option>
                    <option value="2">+2 slots</option>
                    <option value="3">+3 slots</option>
                    <option value="5">+5 slots</option>
                    <option value="10">+10 slots</option>
                </select>
                <button class="bulk-btn" onclick="addSlots()">Add Employee Slots</button>
            </div>
            <div class="slot-list" id="slotList"></div>
            <hr class="panel-divider">
            <div class="lock-section-title">Publish Controls</div>
            <div class="lock-info-text" id="lockInfoText"></div>
            <div class="button-group no-margin-top">
                <button class="button success" id="lockBtn" onclick="publishAndLock()">Publish and Lock</button>
                <button class="button warning hidden" id="unlockBtn" onclick="unlockForEditing()">Unlock for Editing</button>
                <button class="button secondary" onclick="closeHrPanel()">Close</button>
            </div>
        </div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">Edit Award</div>
            <div id="editForm">
                <div class="form-group">
                    <label>Award Title *</label>
                    <input type="text" id="editTitle" placeholder="e.g., Employee of the Month">
                </div>
                <div class="form-group">
                    <label>Employee Name</label>
                    <input type="text" id="editName" placeholder="e.g., John Doe">
                </div>
                <div class="form-group">
                    <label>Achievement Description</label>
                    <textarea id="editAchievement" placeholder="Describe the achievement"></textarea>
                </div>
                <div class="form-group">
                    <label>Employee Photo</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="editPhoto" accept="image/*" onchange="handlePhotoUpload(event)">
                        <label for="editPhoto" class="file-input-label">Click to upload photo</label>
                    </div>
                    <div class="help-text">Or paste image URL below:</div>
                    <input type="text" id="editPhotoUrl" class="url-input" placeholder="https://example.com/photo.jpg">
                </div>
                <div class="button-group">
                    <button class="button secondary" onclick="closeEditModal()">Cancel</button>
                    <button class="button" onclick="saveEdit()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
