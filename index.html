<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall of Fame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #8B0000 0%, #DC143C 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            padding: 30px 0;
        }

        .header h1 {
            color: #FFD700;
            font-size: 3em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        .header .subtitle {
            color: #FFD700;
            font-style: italic;
            font-size: 1.2em;
        }

        .trophy-icon {
            width: 120px;
            height: 120px;
            margin: 20px auto;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .trophy-icon svg {
            width: 70px;
            height: 70px;
            fill: #FFD700;
        }

        .awards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            margin-bottom: 40px;
        }

        .award-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .award-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .award-card::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 4px;
            background: linear-gradient(90deg, #FFD700, #FFA500, #FFD700);
            border-radius: 2px;
        }

        .photo-frame {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #FFD700;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-placeholder {
            color: #999;
            font-size: 3em;
        }

        .award-title {
            color: #8B0000;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .employee-name {
            color: #333;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .achievement {
            color: #666;
            font-size: 0.95em;
            line-height: 1.4;
            font-style: italic;
        }

        .admin-panel {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-top: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .admin-panel h2 {
            color: #8B0000;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .button {
            background: linear-gradient(135deg, #8B0000, #DC143C);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .button:hover {
            transform: scale(1.05);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 968px) {
            .awards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .awards-grid {
                grid-template-columns: 1fr;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2em;
                letter-spacing: 4px;
            }
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #FFD700;
            border-radius: 50%;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <div class="header">
            <h1>WALL of FAME</h1>
            <div class="trophy-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12,15.39L8.24,17.66L9.23,13.38L5.91,10.5L10.29,10.13L12,6.09L13.71,10.13L18.09,10.5L14.77,13.38L15.76,17.66M22,9.24L14.81,8.63L12,2L9.19,8.63L2,9.24L7.45,13.97L5.82,21L12,17.27L18.18,21L16.54,13.97L22,9.24Z"/>
                </svg>
            </div>
        </div>

        <div class="awards-grid" id="awardsGrid">
            <!-- Awards will be populated here -->
        </div>

        <div class="admin-panel" id="adminPanel" style="display: none;">
            <h2>🔒 HR Admin Panel - Update Wall of Fame</h2>
            <form id="awardForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="awardType">Award Category *</label>
                        <select id="awardType" required>
                            <option value="">Select Category</option>
                            <option value="Associate of the Month">Associate of the Month</option>
                            <option value="Executive of the Month">Executive of the Month</option>
                            <option value="Manager of the Month">Manager of the Month</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="employeeName">Employee Name *</label>
                        <input type="text" id="employeeName" required placeholder="Enter employee name">
                    </div>
                </div>
                <div class="form-group">
                    <label for="achievement">Achievement Title *</label>
                    <textarea id="achievement" required placeholder="Describe the achievement"></textarea>
                </div>
                <div class="form-group">
                    <label for="photoUrl">Photo URL</label>
                    <input type="text" id="photoUrl" placeholder="Enter image URL (optional)">
                </div>
                <button type="submit" class="button">Update Award</button>
            </form>
        </div>
    </div>

    <script>
        // Data stored in memory
        let awards = {
            "Associate of the Month": {
                name: "",
                achievement: "",
                photo: ""
            },
            "Executive of the Month": {
                name: "",
                achievement: "",
                photo: ""
            },
            "Manager of the Month": {
                name: "",
                achievement: "",
                photo: ""
            }
        };

        // Create stars background
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                starsContainer.appendChild(star);
            }
        }

        // Render awards
        function renderAwards() {
            const grid = document.getElementById('awardsGrid');
            grid.innerHTML = '';

            const categories = [
                "Associate of the Month",
                "Executive of the Month", 
                "Manager of the Month"
            ];

            categories.forEach(category => {
                const award = awards[category];
                const card = document.createElement('div');
                card.className = 'award-card';
                card.innerHTML = `
                    <div class="photo-frame">
                        ${award.photo ? 
                            `<img src="${award.photo}" alt="${award.name}">` : 
                            '<span class="photo-placeholder">👤</span>'
                        }
                    </div>
                    <div class="award-title">${category}</div>
                    <div class="employee-name">${award.name || 'No Winner Yet'}</div>
                    <div class="achievement">${award.achievement || 'Stay tuned for the next winner!'}</div>
                `;
                grid.appendChild(card);
            });
        }

        // Handle form submission
        document.getElementById('awardForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const awardType = document.getElementById('awardType').value;
            const employeeName = document.getElementById('employeeName').value;
            const achievement = document.getElementById('achievement').value;
            const photoUrl = document.getElementById('photoUrl').value;

            awards[awardType] = {
                name: employeeName,
                achievement: achievement,
                photo: photoUrl
            };

            renderAwards();
            this.reset();
            alert('Award updated successfully!');
        });

        // Check if user is admin (you can modify this logic based on Zoho People permissions)
        // For now, we'll show admin panel. In production, you'd check user role via Zoho API
        const isAdmin = window.location.hash === '#admin';
        if (isAdmin) {
            document.getElementById('adminPanel').style.display = 'block';
        }

        // Initialize
        createStars();
        renderAwards();
    </script>
</body>
</html>
